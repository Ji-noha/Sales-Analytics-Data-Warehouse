version: 2

models:
    - name: stg_orders
      columns:
        - name: order_id
          data_tests:
            - unique
            - not_null
        - name: customer_id
          data_tests:
            - not_null
                  
    - name: stg_order_items
      columns: 
        - name: order_id
          data_tests:
              - not_null
    - name: dim_customer
      columns:
          - name: customer_id
            data_tests: 
                - unique
                - not_null
    - name: dim_products
      columns:
          - name: product_id
            data_tests:
                - unique
                - not_null
    - name: dim_seller
      columns:
          - name: seller_id
            data_tests: 
                - unique
                - not_null
    - name: fact_sales
      description: "This table contains the important details about each sale, where each row represents an order item and includes the related order, seller, product, and customer."
      columns:
          - name: order_id
            description: "Identifies the order."
            tests:
              - not_null
              - relationships:
                  to: ref('dim_orders')  
                  field: order_id

          - name: order_item_id
            description: "Identifies the item within an order."

          - name: product_id
            description: "Identifies the product being sold."
            tests:
              - not_null
              - relationships:
                  to: ref('dim_products')  
                  field: product_id

          - name: seller_id
            description: "Identifies the seller of the product."
            tests:
              - not_null
              - relationships:
                  to: ref('dim_sellers')  
                  field: seller_id

          - name: customer_id
            description: "Identifies the customer who placed the order."
            tests:
              - not_null
              - relationships:
                  to: ref('dim_customer')  
                  field: customer_id

          - name: price
            description: "Price of the order item."

          - name: freight_value
            description: "Freight cost for the order item."

          - name: order_purchase_at
            description: "Timestamp when the order was placed."
          
          - name: order_date
            description: "Date when the order was placed."
            tests:
              - not_null