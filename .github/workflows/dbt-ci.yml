name: dbt-ci

on:
  push:

jobs:
  dbt-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Confirm workflow run
        run: echo "Workflow run confirmed."
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.10.23 dbt-bigquery==1.10.3
      - name: Check dbt installation
        run: dbt --version
      - name: Validate dbt project
        run: |
          mkdir -p ~/.dbt
          echo "olist_analytics:" > ~/.dbt/profiles.yml
          echo "  target: dev" >> ~/.dbt/profiles.yml
          echo "  outputs:" >> ~/.dbt/profiles.yml
          echo "    dev:" >> ~/.dbt/profiles.yml
          echo "      type: bigquery" >> ~/.dbt/profiles.yml
          echo "      method: oauth" >> ~/.dbt/profiles.yml
          echo "      project: southern-shade-469107-i6" >> ~/.dbt/profiles.yml
          echo "      dataset: dbt_olist" >> ~/.dbt/profiles.yml
          echo "      location: US" >> ~/.dbt/profiles.yml
          echo "      threads: 1" >> ~/.dbt/profiles.yml
          dbt parse --project-dir dbt/olist_analytics