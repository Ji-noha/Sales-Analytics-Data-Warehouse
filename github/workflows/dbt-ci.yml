name: dbt-ci

on:
  push:

jobs:
  dbt-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Confirm workflow run
        run: echo "Workflow run confirmed."
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.10.23 dbt-bigquery==1.10.3
      - name: Check dbt installation
        run: dbt --version
      - name: Parse dbt project
        run: dbt parse --project-dir dbt/olist_analytics
